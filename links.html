<!DOCTYPE html>
<html lang="zh-TW">
<!--
  頁面：重要連結（links.html）

  初學者請改這些地方：
  1. 網站名稱 → 搜尋「基隆商工」
  2. 跑馬燈公告 → 搜尋「跑馬燈」
  3. 每一張連結卡片 → 複製下面「一張連結卡片」整塊
     - href="..." 改成要開的網址
     - h3 改標題、p 改說明
     - data-lucide="..." 改圖示名稱（例如 utensils、bar-chart、link）

  左側選單項目請改 js/nav.js。
  開頭的 <script>、<link> 路徑請不要刪。
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重要連結｜基隆商工_美工一班網</title>

    <!-- 字體、樣式、套件：路徑改錯網站會壞掉 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/nav.js"></script>
</head>
<body class="bg-coffee-50 font-sans text-coffee-800 antialiased min-h-screen flex">

    <!-- 手機版選單打開時的暗色背景 -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-coffee-900/40 z-40 hidden md:hidden"></div>

    <!-- ========== 左側選單（選單項目由 js/nav.js 自動產生） ========== -->
    <aside id="site-sidebar"
           class="fixed md:sticky top-0 left-0 z-50 md:z-30 h-screen w-64 bg-white border-r border-coffee-200 flex flex-col shrink-0 -translate-x-full md:translate-x-0 transition-transform duration-200">
        <div class="px-5 py-4 border-b border-coffee-200 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 font-bold text-coffee-900">
                <div class="w-6 h-6 rounded-full border-2 border-coffee-800 flex items-center justify-center">
                    <div class="w-2 h-2 bg-coffee-800 rounded-full"></div>
                </div>
                <span class="text-base leading-tight">基隆商工_美工一班網</span>
            </a>
            <button id="sidebar-close" type="button" class="md:hidden p-1.5 rounded-lg text-coffee-500 hover:bg-coffee-100" aria-label="關閉選單">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <nav data-site-nav class="p-3 flex flex-col gap-1 overflow-y-auto"></nav>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 min-h-screen">

        <!-- 上方標題列：手機才會出現漢堡選單 -->
        <header class="bg-white border-b border-coffee-200 px-4 md:px-6 py-4 shadow-sm flex items-center gap-3 sticky top-0 z-30">
            <button id="sidebar-open" type="button" class="md:hidden p-1.5 rounded-lg text-coffee-700 hover:bg-coffee-100" aria-label="開啟選單">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <h1 data-page-title class="font-bold text-lg text-coffee-900"></h1>
        </header>

        <main class="flex-1 w-full max-w-5xl mx-auto p-4 md:p-8 overflow-hidden flex flex-col">

            <!-- 跑馬燈：改這裡的文字即可 -->
            <div class="mb-6 bg-amber-50 border-l-4 border-amber-500 text-amber-900 px-4 py-3 rounded-r-lg shadow-sm flex items-center shrink-0">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600 mr-3 shrink-0"></i>
                <div class="marquee-container flex-1">
                    <div class="animate-marquee inline-block text-sm font-medium w-full">
                        <span class="font-bold text-amber-700 mr-1">【公告】</span>
                        8/31 為開學日，請穿著制服、攜帶文具準時到校。
                    </div>
                </div>
            </div>

            <!-- ========== 本頁內容：重要連結卡片 ========== -->
            <div class="bg-white border border-coffee-200 rounded-xl shadow-sm flex flex-col flex-1 overflow-hidden">
                <div class="p-6 overflow-y-auto flex-1">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

                        <!-- 一張連結卡片：改 href、標題、說明 -->
                        <a href="https://www.klcivs.kl.edu.tw/home" target="_blank" class="flex flex-col p-5 bg-white border border-coffee-200 rounded-xl hover:border-coffee-400 hover:shadow-md transition-all group">
                            <div class="flex justify-between items-start mb-3">
                                <div class="bg-coffee-100 p-2.5 rounded-lg text-coffee-700 group-hover:bg-coffee-700 group-hover:text-white transition-colors">
                                    <i data-lucide="school" class="w-5 h-5"></i>
                                </div>
                                <i data-lucide="external-link" class="w-4 h-4 text-coffee-300 group-hover:text-coffee-600 transition-colors"></i>
                            </div>
                            <h3 class="font-bold text-coffee-900 mb-1 group-hover:underline underline-offset-4">基隆商工官網</h3>
                            <p class="text-xs text-coffee-500">學校大小事公告區，請養成隨時關注最新消息習慣。</p>
                        </a>

                        <!-- 一張連結卡片 -->
                        <a href="https://klcivs-kl.k12ea.gov.tw/SCH_UI/" target="_blank" class="flex flex-col p-5 bg-white border border-coffee-200 rounded-xl hover:border-coffee-400 hover:shadow-md transition-all group">
                            <div class="flex justify-between items-start mb-3">
                                <div class="bg-coffee-100 p-2.5 rounded-lg text-coffee-700 group-hover:bg-coffee-700 group-hover:text-white transition-colors">
                                    <i data-lucide="bar-chart" class="w-5 h-5"></i>
                                </div>
                                <i data-lucide="external-link" class="w-4 h-4 text-coffee-300 group-hover:text-coffee-600 transition-colors"></i>
                            </div>
                            <h3 class="font-bold text-coffee-900 mb-1 group-hover:underline underline-offset-4">學生校務行政系統</h3>
                            <p class="text-xs text-coffee-500">請假、出勤獎懲、學習歷程、修課紀錄、選課等功能。</p>
                        </a>

                        <!-- 一張連結卡片 -->
                        <a href="https://www.klcivs.kl.edu.tw/home?cid=3140" target="_blank" class="flex flex-col p-5 bg-white border border-coffee-200 rounded-xl hover:border-coffee-400 hover:shadow-md transition-all group">
                            <div class="flex justify-between items-start mb-3">
                                <div class="bg-coffee-100 p-2.5 rounded-lg text-coffee-700 group-hover:bg-coffee-700 group-hover:text-white transition-colors">
                                    <i data-lucide="calendar-clock" class="w-5 h-5"></i>
                                </div>
                                <i data-lucide="external-link" class="w-4 h-4 text-coffee-300 group-hover:text-coffee-600 transition-colors"></i>
                            </div>
                            <h3 class="font-bold text-coffee-900 mb-1 group-hover:underline underline-offset-4">學校行事曆</h3>
                            <p class="text-xs text-coffee-500">學校各種活動安排時辰。</p>
                        </a>                        

                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/icons.js"></script>
</body>
</html>
